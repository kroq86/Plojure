name: Publish OCI Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OCI version to publish, for example 0.1.1"
        required: true
        type: string
  push:
    tags:
      - "vector-db-v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/vector-db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#vector-db-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kroq86/vector-db-mcp
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=vector-db-mcp
            org.opencontainers.image.description=Assembly-accelerated DuckDB MCP server for code search, indexing, and symbol lookup.
            org.opencontainers.image.source=https://github.com/kroq86/Plojure
            org.opencontainers.image.url=https://github.com/kroq86/Plojure/tree/hybrid/projects/vector-db
            org.opencontainers.image.documentation=https://github.com/kroq86/Plojure/tree/hybrid/projects/vector-db
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./projects/vector-db
          file: ./projects/vector-db/Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
